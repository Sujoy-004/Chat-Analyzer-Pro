name: CI

# Run on pushes and pull requests against any branch.
on:
  push:
  pull_request:

# Cancel in-progress runs for the same ref so a newer push wins.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lean matrix job: base install only (no [nlp] extras) across Python/OS.
  # Runs the FAST suite only; the wall-clock-slow CLI/e2e tests are gated by
  # @pytest.mark.slow (registered in pyproject.toml) and run in the "slow"
  # job below.
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    timeout-minutes: 30
    env:
      # Avoid spawning a browser and skip any NLP downloads/imports.
      BROWSER: "__none__"
      CHAT_ANALYZER_NO_OPEN: "1"
      CHAT_ANALYZER_FORCE_NLP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run lean test suite (exclude slow tests)
        run: python -m pytest -m "not slow" -q -p no:cacheprovider

  # Slow job: base install, but exercises the wall-clock-slow CLI/e2e tests
  # (subprocess spawns + full pipeline renders). No torch needed. Also runs
  # ruff once here (single run, not per matrix combo).
  slow:
    name: slow tests (base install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER: "__none__"
      CHAT_ANALYZER_NO_OPEN: "1"
      CHAT_ANALYZER_FORCE_NLP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install base package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: python -m ruff check src tests
      - name: Run slow test suite
        run: python -m pytest -m "slow" -q -p no:cacheprovider

  # NLP job: proves the gated optional [nlp] extra installs and the real
  # torch/transformers-gated tests pass. test_phase4_nlp.py skips its gate-ON
  # cases when transformers is absent, so this job installs the extra and runs
  # that file to exercise the model-load mock path for real.
  nlp:
    name: nlp ([nlp] extra)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Avoid spawning a browser and skip any NLP downloads/imports.
      BROWSER: "__none__"
      CHAT_ANALYZER_NO_OPEN: "1"
      CHAT_ANALYZER_FORCE_NLP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Full install adds torch + transformers (heavy) via the [nlp] extra;
      # proves the gated optional-dependency path works end to end.
      - name: Install package with dev and nlp extras
        run: python -m pip install -e ".[dev,nlp]"
      - name: Run NLP-gated tests
        run: python -m pytest tests/test_phase4_nlp.py -q -p no:cacheprovider
