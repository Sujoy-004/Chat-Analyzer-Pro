[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "chat-analyzer-pro"
version = "0.1.0"
description = "Analyze WhatsApp and Telegram chat exports from the terminal"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "vaderSentiment>=3.3.2",
    "wordcloud>=1.9.0",
    "networkx>=3.1",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "typer>=0.27",
    "rich>=13",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# sentencepiece is required by transformers' T5Tokenizer — transformers does
# NOT auto-install it, so the ANAL-08 summarizer would silently degrade
# without it (04-02 Rule 2 fix).
nlp = ["torch>=2.0", "transformers>=4.30,<6", "sentencepiece>=0.1.99"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.16.1"]

[project.scripts]
chat-analyzer = "chat_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_analyzer"]
